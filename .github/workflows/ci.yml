name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run Pytest
        run: |
          pytest -W error --cov=secure_gateway --cov-report=term-missing --cov-fail-under=85

      - name: Lint
        run: python -m ruff check src tests examples

      - name: Type check
        run: python -m mypy src

  language-grammars:
    name: Independent language grammar validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v2
      - name: Install development grammar validators
        run: uv pip install --system -e ".[dev,native-validation]" lupa==2.8
      - name: Install the NASM syntax validator
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
      - name: Compare original and masked source with independent parsers
        env:
          SECURE_GATEWAY_NATIVE_PARSERS: "1"
        run: python -m pytest tests/test_extended_code.py tests/test_contextual_remaining_issues.py tests/test_ruby_constant_aliases.py tests/test_runtime_bindings_16.py -q -W error

  package:
    name: Distribution smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v2
      - name: Build wheel and source distribution
        run: uv build
      - name: Install distributions outside the source tree
        run: python scripts/package_smoke.py
