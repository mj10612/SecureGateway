name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Verify dependency lock consistency
        run: |
          uv lock --check

      - name: Install dependencies
        run: |
          uv sync --locked --all-extras

      - name: Run Pytest
        run: |
          uv run --locked --all-extras pytest -W error --cov=secure_gateway --cov-report=term-missing --cov-fail-under=85

      - name: Offline privacy evaluation and regression comparison
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          uv run --locked --all-extras secure-gateway evaluate --suite privacy --profile release --output-dir "${{ runner.temp }}/sg-evaluation"
          uv run --locked --all-extras secure-gateway evaluate compare --baseline docs/evaluations/issue324-2.7.0/legacy-privacy/report.json --candidate "${{ runner.temp }}/sg-evaluation/report.json"

      - name: Lint
        run: uv run --locked --all-extras python -m ruff check src tests examples

      - name: Type check
        run: uv run --locked --all-extras python -m mypy src

  language-grammars:
    name: Independent language grammar validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v2
      - name: Verify dependency lock consistency
        run: uv lock --check
      - name: Install development grammar validators
        run: |
          uv sync --locked --extra dev --extra native-validation
          uv pip install --python .venv lupa==2.8 --no-deps
      - name: Install the NASM syntax validator
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
      - name: Compare original and masked source with independent parsers
        env:
          SECURE_GATEWAY_NATIVE_PARSERS: "1"
        run: uv run --locked --extra dev --extra native-validation --no-sync python -m pytest tests/test_extended_code.py tests/test_contextual_remaining_issues.py tests/test_ruby_constant_aliases.py tests/test_runtime_bindings_16.py tests/test_java_sql_regressions_18.py tests/test_bash_kotlin_syntax_18.py -q -W error

  package:
    name: Distribution smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v2
      - name: Build wheel and source distribution
        run: uv build
      - name: Install distributions outside the source tree
        run: python scripts/package_smoke.py

  native-release:
    name: Native artifact lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v2
      - name: Install pinned offline host clients
        run: npm install --global @anthropic-ai/claude-code@2.1.319 @openai/codex@0.167.0
      - name: Build current and immutable previous artifacts
        shell: bash
        run: |
          python - <<'PY'
          import io, os, pathlib, subprocess, tarfile
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          previous = temporary / 'sg-previous'
          previous.mkdir(parents=True, exist_ok=True)
          snapshot = subprocess.check_output(['git', '-c', 'core.autocrlf=false', 'archive', '56e988353f9db169e01d624d7a2d2eaa1a19ca27'])
          with tarfile.open(fileobj=io.BytesIO(snapshot)) as archive:
              archive.extractall(previous, filter='data')
          subprocess.run(['uv', 'build', str(previous), '--wheel', '--out-dir', str(temporary / 'sg-previous-dist')], check=True)
          PY
          uv build
      - name: Require native clients and installed upgrade lifecycle
        shell: bash
        run: |
          export SECURE_GATEWAY_CLAUDE_BINARY="$(command -v claude)"
          export SECURE_GATEWAY_CODEX_BINARY="$(command -v codex)"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            export SG_NPM_ROOT="$(npm root -g)"
            export SECURE_GATEWAY_CLAUDE_BINARY="$(python -c "import os,pathlib; print(next(pathlib.Path(os.environ['SG_NPM_ROOT']).rglob('claude.exe')))")"
            export SECURE_GATEWAY_CODEX_BINARY="$(python -c "import os,pathlib; print(next(pathlib.Path(os.environ['SG_NPM_ROOT']).rglob('codex.exe')))")"
          fi
          python scripts/package_smoke.py --require-native --upgrade-from "${RUNNER_TEMP}/sg-previous-dist/secure_gateway-2.6.0-py3-none-any.whl"
