[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure-gateway"
version = "2.7.15"
description = "Local multilingual masking and automatic Claude/Codex subscription privacy gateway"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "SecureGateway Contributors" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "privacy",
    "anonymization",
    "token-masking",
    "llm-security",
    "openai",
    "claude",
    "anthropic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "click>=8.0.0,<9.0.0",
    "rich>=13.0.0,<16.0.0",
    "cryptography>=41.0.0,<51.0.0",
    "tomlkit>=0.13.0,<1.0.0",
    "jieba>=0.42.1,<1.0.0",
    "tinysegmenter>=0.4,<1.0",
    "wordfreq==3.1.1",
]

[project.optional-dependencies]
context = [
    "numpy>=1.24,<3.0",
    "onnxruntime>=1.20,<2.0",
    "tokenizers>=0.21,<1.0",
]
context-eval = [
    "scikit-learn>=1.4,<2.0",
    "psutil>=5.9,<8.0",
]
native-validation = [
    "tree-sitter-language-pack==1.22.1",
]
dev = [
    "pytest>=7.0.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "pytest-cov>=4.0,<8.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.10,<3.0",
    "jsonschema>=4.0,<5.0",
]

[project.scripts]
secure-gateway = "secure_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
source = ["secure_gateway"]

[tool.coverage.report]
fail_under = 85
show_missing = true
