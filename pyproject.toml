[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure-mcp"
version = "0.6.2"
description = "Local English/Korean masking and automatic Claude/Codex subscription privacy gateway"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "SecureMCP Contributors", email = "maintainers@securemcp.org" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "privacy",
    "anonymization",
    "token-masking",
    "llm-security",
    "openai",
    "claude",
    "anthropic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "cryptography>=41.0.0",
    "tomlkit>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.0",
    "ruff>=0.9",
    "mypy>=1.10",
]

[project.scripts]
secure-mcp = "secure_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
source = ["secure_mcp"]

[tool.coverage.report]
fail_under = 85
show_missing = true
